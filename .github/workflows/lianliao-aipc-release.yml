name: Release LianLiaoAIPC

on:
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version without v, for example 2.1.28
        required: true
        type: string
      release_scope:
        description: Platforms included in this release
        required: true
        default: windows-x64
        type: choice
        options:
          - all
          - windows-x64

permissions:
  actions: write
  contents: write

concurrency:
  group: lianliao-aipc-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release input
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      release_scope: ${{ steps.release.outputs.release_scope }}
      matrix_json: ${{ steps.release.outputs.matrix_json }}
      platforms: ${{ steps.release.outputs.platforms }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate version, branch, Release tag, and Core lock
        id: release
        working-directory: LianLiaoAIPC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          set -euo pipefail
          version="$(printf '%s' "${INPUT_VERSION}" | xargs)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use x.y.z format without v. Received: ${version}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "master" ]]; then
            echo "Formal desktop releases must run from master." >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" != "${version}" ]]; then
            echo "Input version ${version} does not match package.json version ${package_version}." >&2
            exit 1
          fi

          tag="desktop-v${version}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists and will not be overwritten." >&2
            exit 1
          fi

          node scripts/verifyAioncoreReleaseLock.js

          release_scope="$(printf '%s' "${INPUT_RELEASE_SCOPE}" | xargs)"
          case "${release_scope}" in
            all)
              for runtime in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64; do
                node scripts/verifyAioncoreReleaseLock.js "${runtime}" >/dev/null
              done
              matrix_json='{"include":[{"key":"windows-x64","runner":"windows-latest","runtime":"win32-x64","command":"bun run build-win:x64","source_suffixes":"win-x64.exe","asset_suffixes":"win-x64.exe"},{"key":"windows-arm64","runner":"windows-11-arm","runtime":"win32-arm64","command":"bun run build-win:arm64","source_suffixes":"win-arm64.exe","asset_suffixes":"win-arm64.exe"},{"key":"macos-x64","runner":"macos-15-intel","runtime":"darwin-x64","command":"bun run build-mac:x64","source_suffixes":"mac-x64.dmg mac-x64.zip","asset_suffixes":"mac-x64.dmg mac-x64.zip"},{"key":"macos-arm64","runner":"macos-15","runtime":"darwin-arm64","command":"bun run build-mac:arm64","source_suffixes":"mac-arm64.dmg mac-arm64.zip","asset_suffixes":"mac-arm64.dmg mac-arm64.zip"},{"key":"linux-x64","runner":"ubuntu-22.04","runtime":"linux-x64","command":"bun run build-deb","source_suffixes":"linux-amd64.deb","asset_suffixes":"linux-x64.deb"}]}'
              platforms='Windows x64/ARM64, macOS x64/ARM64, Ubuntu x64'
              ;;
            windows-x64)
              node scripts/verifyAioncoreReleaseLock.js win32-x64 >/dev/null
              matrix_json='{"include":[{"key":"windows-x64","runner":"windows-latest","runtime":"win32-x64","command":"bun run build-win:x64","source_suffixes":"win-x64.exe","asset_suffixes":"win-x64.exe"}]}'
              platforms='Windows x64'
              ;;
            *)
              echo "Unsupported release scope: ${release_scope}" >&2
              exit 1
              ;;
          esac

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "release_scope=${release_scope}" >> "${GITHUB_OUTPUT}"
          echo "matrix_json=${matrix_json}" >> "${GITHUB_OUTPUT}"
          echo "platforms=${platforms}" >> "${GITHUB_OUTPUT}"

  create-draft-release:
    name: Create draft GitHub Release
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - name: Create release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.release_scope }}
        run: |
          {
            echo "## 链上辽宁·产业云城 AI桌面平台 v${VERSION}"
            echo
            if [[ "${RELEASE_SCOPE}" == "windows-x64" ]]; then
              echo "- 本次为 Windows x64 专项发布，不包含 macOS、Linux 或 Windows ARM64 安装包"
            else
              echo "- Windows：x64、ARM64 安装程序"
              echo "- macOS：Intel x64、Apple Silicon ARM64 的 DMG 和 ZIP"
              echo "- Ubuntu：x64 DEB"
            fi
            echo '- LianLiaoAICore：由 `LianLiaoAIPC/aioncore-release-lock.json` 固定版本和 SHA256'
            echo '- 完整性校验：下载后请使用同页 `SHA256SUMS.txt`'
            echo '- Windows 签名：当前未配置代码签名证书，SmartScreen 可能显示安全提示'
            if [[ "${RELEASE_SCOPE}" == "all" ]]; then
              echo '- macOS 签名：当前使用 ad-hoc 签名且未经过 Apple 公证，首次启动可能出现 Gatekeeper 提示'
            fi
          } > release-notes.md

      - name: Create draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "链上辽宁·产业云城 AI桌面平台 v${VERSION}" \
            --notes-file release-notes.md \
            --draft

  build-platform:
    name: Build ${{ matrix.key }}
    needs:
      - validate
      - create-draft-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix_json) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: LianLiaoAIPC
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      GH_TOKEN: ${{ github.token }}
      LIANLIAO_RELEASE_BUILD: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Verify target Core release lock
        shell: bash
        run: node scripts/verifyAioncoreReleaseLock.js "${{ matrix.runtime }}"

      - name: Build platform installers
        shell: bash
        run: ${{ matrix.command }}

      - name: Stage exact platform assets
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          SOURCE_SUFFIXES: ${{ matrix.source_suffixes }}
          ASSET_SUFFIXES: ${{ matrix.asset_suffixes }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          read -r -a source_suffixes <<< "${SOURCE_SUFFIXES}"
          read -r -a asset_suffixes <<< "${ASSET_SUFFIXES}"
          if [[ "${#source_suffixes[@]}" -ne "${#asset_suffixes[@]}" ]]; then
            echo "Source and public asset name counts differ." >&2
            exit 1
          fi

          for ((index = 0; index < ${#source_suffixes[@]}; index++)); do
            source_name="LianLiaoAIPC-${VERSION}-${source_suffixes[index]}"
            asset_name="LianLiaoAIPC-${VERSION}-${asset_suffixes[index]}"
            source="out/${source_name}"
            if [[ ! -s "${source}" ]]; then
              echo "Expected non-empty installer was not generated: ${source}" >&2
              exit 1
            fi
            cp "${source}" "release-assets/${asset_name}"
          done

          staged_count="$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')"
          expected_count="$(wc -w <<< "${ASSET_SUFFIXES}" | tr -d ' ')"
          if [[ "${staged_count}" != "${expected_count}" ]]; then
            echo "Expected ${expected_count} staged files, found ${staged_count}." >&2
            exit 1
          fi

      - name: Upload platform assets to draft Release
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          assets=()
          while IFS= read -r asset; do
            assets+=("${asset}")
          done < <(find release-assets -maxdepth 1 -type f -print | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "No staged release assets found." >&2
            exit 1
          fi
          gh release upload "${TAG}" "${assets[@]}" --repo "${GITHUB_REPOSITORY}"

      - name: Report platform build
        shell: bash
        env:
          PLATFORM_KEY: ${{ matrix.key }}
        run: |
          {
            echo "## ${PLATFORM_KEY}"
            echo
            find release-assets -maxdepth 1 -type f -printf -- '- %f (%s bytes)\n' 2>/dev/null || \
              find release-assets -maxdepth 1 -type f -exec sh -c 'printf -- "- %s (%s bytes)\n" "$(basename "$1")" "$(wc -c < "$1")"' _ {} \;
          } >> "${GITHUB_STEP_SUMMARY}"

  verify-and-publish:
    name: Verify assets and publish Release
    needs:
      - validate
      - create-draft-release
      - build-platform
    runs-on: ubuntu-22.04
    steps:
      - name: Download installers from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "LianLiaoAIPC-${VERSION}-*" \
            --dir release-assets

      - name: Verify complete asset set and generate SHA256SUMS.txt
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.release_scope }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_SCOPE}" == "windows-x64" ]]; then
            expected=("LianLiaoAIPC-${VERSION}-win-x64.exe")
          else
            expected=(
              "LianLiaoAIPC-${VERSION}-win-x64.exe"
              "LianLiaoAIPC-${VERSION}-win-arm64.exe"
              "LianLiaoAIPC-${VERSION}-mac-x64.dmg"
              "LianLiaoAIPC-${VERSION}-mac-x64.zip"
              "LianLiaoAIPC-${VERSION}-mac-arm64.dmg"
              "LianLiaoAIPC-${VERSION}-mac-arm64.zip"
              "LianLiaoAIPC-${VERSION}-linux-x64.deb"
            )
          fi
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")
          (cd release-assets && sha256sum "${wanted[@]}" > SHA256SUMS.txt)

      - name: Upload checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          gh release upload "${TAG}" release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify final draft Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SCOPE: ${{ needs.validate.outputs.release_scope }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_SCOPE}" == "windows-x64" ]]; then
            expected=(
              "LianLiaoAIPC-${VERSION}-win-x64.exe"
              "SHA256SUMS.txt"
            )
          else
            expected=(
              "LianLiaoAIPC-${VERSION}-win-x64.exe"
              "LianLiaoAIPC-${VERSION}-win-arm64.exe"
              "LianLiaoAIPC-${VERSION}-mac-x64.dmg"
              "LianLiaoAIPC-${VERSION}-mac-x64.zip"
              "LianLiaoAIPC-${VERSION}-mac-arm64.dmg"
              "LianLiaoAIPC-${VERSION}-mac-arm64.zip"
              "LianLiaoAIPC-${VERSION}-linux-x64.deb"
              "SHA256SUMS.txt"
            )
          fi
          mapfile -t actual < <(
            gh release view "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets \
              --jq '.assets[].name' |
              sort
          )
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${wanted[@]}") <(printf '%s\n' "${actual[@]}")

      - name: Create lightweight release report
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORMS: ${{ needs.validate.outputs.platforms }}
        run: |
          set -euo pipefail
          mkdir -p release-report
          cp release-assets/SHA256SUMS.txt release-report/SHA256SUMS.txt
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "commit=${GITHUB_SHA}"
            echo "generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "[assets]"
            while IFS= read -r file; do
              echo "$(basename "${file}")=$(stat -c '%s' "${file}")"
            done < <(find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt | sort)
          } > release-report/manifest.txt

      - name: Remove previous desktop artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t artifact_ids < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.name | startswith("LianLiaoAIPC-")) | .id'
          )
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Upload Actions artifact
        id: report_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: LianLiaoAIPC-${{ needs.validate.outputs.version }}-release-report
          path: release-report
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false

      - name: Write release summary
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "## LianLiaoAIPC v${VERSION}"
            echo
            echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platforms: ${PLATFORMS}"
            if [[ "${{ steps.report_artifact.outcome }}" != "success" ]]; then
              echo "- Actions Artifact: upload failed; formal Release assets are unaffected"
            else
              echo "- Actions Artifact: one lightweight release report"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  report-failure:
    name: Report incomplete draft
    if: failure()
    needs:
      - validate
      - create-draft-release
      - build-platform
      - verify-and-publish
    runs-on: ubuntu-22.04
    steps:
      - name: Keep failed release private
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          {
            echo "## Desktop release failed"
            echo
            echo "The incomplete Release remains a draft and was not exposed to users."
            echo "Draft tag: \`${TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
