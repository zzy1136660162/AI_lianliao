name: Release LianLiaoAICore

on:
  workflow_dispatch:
    inputs:
      version:
        description: LianLiaoAICore version without the v prefix
        required: true
        type: string
      release_scope:
        description: Platforms to publish
        required: true
        default: windows-x64
        type: choice
        options:
          - windows-x64
          - all
  push:
    tags:
      - "aicore-v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_scope: ${{ steps.version.outputs.release_scope }}
      build_matrix: ${{ steps.version.outputs.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_SCOPE: ${{ inputs.release_scope }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION#v}"
            RELEASE_SCOPE="${INPUT_RELEASE_SCOPE:-windows-x64}"
          else
            VERSION="${REF_NAME#aicore-v}"
            RELEASE_SCOPE="windows-x64"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid semantic version: ${VERSION}" >&2
            exit 1
          fi
          case "${RELEASE_SCOPE}" in
            windows-x64)
              BUILD_MATRIX='{"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","binary":"aioncore.exe","archive":"zip"}]}'
              ;;
            all)
              BUILD_MATRIX='{"include":[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","binary":"aioncore.exe","archive":"zip"},{"os":"windows-11-arm","target":"aarch64-pc-windows-msvc","binary":"aioncore.exe","archive":"zip"},{"os":"macos-15-intel","target":"x86_64-apple-darwin","binary":"aioncore","archive":"tar.gz"},{"os":"macos-15","target":"aarch64-apple-darwin","binary":"aioncore","archive":"tar.gz"},{"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","binary":"aioncore","archive":"tar.gz"}]}'
              ;;
            *)
              echo "Unsupported release scope: ${RELEASE_SCOPE}" >&2
              exit 1
              ;;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=aicore-v${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_scope=${RELEASE_SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "build_matrix=${BUILD_MATRIX}" >> "${GITHUB_OUTPUT}"

      - name: Validate source release version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          root = pathlib.Path("LianLiaoAICore")
          manifest = (root / "Cargo.toml").read_text(encoding="utf-8")
          workspace_package = manifest.split("[workspace.package]", 1)[1]
          match = re.search(r'^version\s*=\s*"([^"]+)"', workspace_package, re.MULTILINE)
          if match is None:
              raise SystemExit("Missing workspace package version in Cargo.toml")
          source_version = match.group(1)
          release_version = os.environ["RELEASE_VERSION"]
          if source_version != release_version:
              raise SystemExit(
                  f"Release version {release_version} does not match Cargo.toml {source_version}"
              )

          migration_versions = sorted(
              int(path.name.split("_", 1)[0])
              for path in (root / "crates" / "aionui-db" / "migrations").glob("[0-9]*_*.sql")
          )
          expected_versions = list(range(1, migration_versions[-1] + 1))
          if migration_versions != expected_versions:
              raise SystemExit(f"Non-contiguous database migrations: {migration_versions}")
          if migration_versions[-1] < 25:
              raise SystemExit("Core 0.1.49 must include database migration 25")
          PY

      - name: Ensure draft GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SCOPE: ${{ steps.version.outputs.release_scope }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Published Release ${RELEASE_TAG} already exists and is immutable." >&2
              exit 1
            fi
            echo "Draft Release ${RELEASE_TAG} already exists; resuming the interrupted build."
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "LianLiaoAICore v${VERSION}" \
              --notes "链辽 AI Core 发布范围：${RELEASE_SCOPE}。桌面端构建必须使用 aioncore-release-lock.json 固定资产和 SHA256。" \
              --draft
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: LianLiaoAICore
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain and target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}

      - name: Build Windows release binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --target ${{ matrix.target }} -p aionui-app

      - name: Build Unix release binary
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} -p aionui-app

      - name: Archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = "dist/lianliao-aicore-v${env:VERSION}-${env:TARGET}.zip"
          Compress-Archive -LiteralPath "target/${env:TARGET}/release/${env:BINARY}" -DestinationPath $archive -Force

      - name: Archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir -p dist
          tar -C "target/${TARGET}/release" -czf \
            "dist/lianliao-aicore-v${VERSION}-${TARGET}.tar.gz" \
            "${BINARY}"

      # 直接上传草稿 Release，避免依赖 GitHub Actions artifact 存储配额。
      - name: Upload platform archive to draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SCOPE: ${{ needs.prepare.outputs.release_scope }}
        run: |
          shopt -s nullglob
          archives=(dist/lianliao-aicore-*)
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo "Expected exactly one platform archive, found ${#archives[@]}" >&2
            exit 1
          fi
          gh release upload "${RELEASE_TAG}" "${archives[0]}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

  publish:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download platform archives from draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          RELEASE_SCOPE: ${{ needs.prepare.outputs.release_scope }}
        run: |
          mkdir -p artifacts
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "lianliao-aicore-v${{ needs.prepare.outputs.version }}-*" \
            --dir artifacts

          expected_assets=(
            "lianliao-aicore-v${{ needs.prepare.outputs.version }}-x86_64-pc-windows-msvc.zip"
          )
          if [[ "${RELEASE_SCOPE}" == "all" ]]; then
            expected_assets+=(
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-aarch64-pc-windows-msvc.zip"
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-x86_64-apple-darwin.tar.gz"
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-aarch64-apple-darwin.tar.gz"
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
            )
          fi
          for asset in "${expected_assets[@]}"; do
            if [[ ! -f "artifacts/${asset}" ]]; then
              echo "Missing required Release asset: ${asset}" >&2
              exit 1
            fi
          done

      - name: Generate SHA256SUMS
        working-directory: artifacts
        env:
          RELEASE_SCOPE: ${{ needs.prepare.outputs.release_scope }}
        run: |
          assets=(
            "lianliao-aicore-v${{ needs.prepare.outputs.version }}-x86_64-pc-windows-msvc.zip"
          )
          if [[ "${RELEASE_SCOPE}" == "all" ]]; then
            assets+=(
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-aarch64-pc-windows-msvc.zip"
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-x86_64-apple-darwin.tar.gz"
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-aarch64-apple-darwin.tar.gz"
              "lianliao-aicore-v${{ needs.prepare.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz"
            )
          fi
          sha256sum "${assets[@]}" > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" artifacts/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false
